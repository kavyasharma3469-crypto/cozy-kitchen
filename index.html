<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Home Cloud Kitchen</title>
    <style>
        body {
            background-color: #fcf8f2; /* Warm, cozy cream color */
            color: #4a3728; /* Cozy brown text */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        button {
            background-color: #d97443; /* Warm autumn orange */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Cozy Kitchen 🏡</h1>
        <p>Your favorite homemade meals, delivered straight to your door.</p>
        <button onclick="alert('Order placed! Time to play the cooking game!')">Order Now</button>
    </div>
</body>
</html>
